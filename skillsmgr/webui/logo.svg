<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Jackfield">
  <!-- Jackfield, "Quiet soft J" (B7), chosen 2026-11-26; kit in branding/jackfield/kit.
       A 3x3 field of jacks: the lit cells spell J, the three quiet cells stay
       grey, and the blue cell is the jack being patched in. Cells sit on the
       same 2/12/22 grid as the old switchboard, one whole pixel at 16 px. -->
  <style>
    .q { fill: #ddddd8 } .c { fill: #191917 } .f { fill: #2d58d0 }
    @media (prefers-color-scheme: dark) { .q { fill: #2c2c2a } .c { fill: #ededea } .f { fill: #8caeff } }
  </style>
