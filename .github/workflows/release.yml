name: Release

# Controlled release path: tag -> build once -> verify -> attest -> publish
# the tested artifacts -> verify PyPI downloads -> GitHub Release.
#
# Policy: first-party and third-party actions below are pinned to reviewed full
# commit SHAs with an inline version/date comment. The first-party pins are
# also listed here for quick review: checkout@v7.0.1 =
# 3d3c42e5aac5ba805825da76410c181273ba90b1, setup-python@v7.1.0 =
# 6d4fd22b20465ccc0f7354476588e8df7c9ca0e0, upload-artifact@v7.0.2 =
# cf430e030ddbb5b0abf93d22962f4752f3646cd9, download-artifact@v8.0.2 =
# 9000827ccba6bdab643e8b6fd33ac0654aef8333, and
# attest-build-provenance@v4.2.2 = 4d101475d8b20a2381f78447822ac1eab6504dd8 —
# reviewed 2026-11-07 (all node24; SHAs cross-checked with git ls-remote);
# re-verify SHAs before changing them. A version tag starts publication.
# A manual run builds and verifies the candidate through the same checks.
# TestPyPI must succeed before PyPI Trusted Publishing (OIDC) runs in the
# `release` environment.

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — 2026-11-07 reviewed
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 — 2026-11-07 reviewed
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          import skillsmgr

          tag = os.environ["RELEASE_TAG"]
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"', Path("pyproject.toml").read_text())
          if not match:
              raise SystemExit("package version is missing from pyproject.toml")
          version = match.group(1)
          if tag != "v" + version:
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}")
          if skillsmgr.__version__ != version:
              raise SystemExit("source __version__ does not match the package version")
          PY
      - name: Install the pinned, hash-verified build toolchain
        # SEC-8: the backend is pinned in pyproject.toml (`setuptools==…`) and
        # this lock pins + hashes the outer toolchain, so the attested bytes do
        # not depend on whatever PyPI serves on the day of the release.
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-build.txt
      - name: Build wheel and sdist once
        run: python3 -m build --no-isolation --wheel --sdist --outdir dist
      - name: Verify package data on the exact artifacts
        run: python3 check_package_data.py --dist-dir dist
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — 2026-11-07 reviewed
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  verify:
    name: verify exact artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — 2026-11-07 reviewed
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 — 2026-11-07 reviewed
        with:
          python-version: "3.12"
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — 2026-11-07 reviewed
        with:
          name: dist
          path: dist
      - name: Package data and clean recovery on both release artifacts
        run: python check_package_data.py --dist-dir dist --install --require-build
      - name: Upgrade and restore from the pinned published wheel
        run: python -m tools.verify_upgrade --dist-dir dist
      - name: Unit tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests
      - name: Docs consistency
        if: runner.os == 'Linux'
        run: python3 check_docs.py
      - name: AI CLI on the exact installed wheel (offline fake provider)
        if: runner.os == 'Linux'
        run: python3 tools/verify_ai.py --artifact dist/*.whl

  attest:
    name: attest build provenance
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — 2026-11-07 reviewed
        with:
          name: dist
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 — 2026-11-07 reviewed
        with:
          subject-path: "dist/*"

  publish-testpypi:
    name: publish to TestPyPI
    runs-on: ubuntu-latest
    needs: attest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — 2026-11-07 reviewed
        with:
          name: dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 — 2026-11-20 reviewed
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: publish-testpypi
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — 2026-11-07 reviewed
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 — 2026-11-20 reviewed
        with:
          attestations: true

  github-release:
    name: github release with verified artifacts
    runs-on: ubuntu-latest
    needs: postpublish-verify
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — 2026-11-07 reviewed
        with:
          name: dist
          path: dist
      - name: Create GitHub Release with the exact artifacts
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4 — 2026-11-07 reviewed
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
  postpublish-verify:
    name: verify both published PyPI downloads
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: publish-pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — 2026-11-07 reviewed
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 — 2026-11-07 reviewed
        with:
          python-version: "3.12"
      - name: Download tested release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 — 2026-11-07 reviewed
        with:
          name: dist
          path: dist
      - name: Compare both published files with the tested artifacts
        run: python3 tools/verify_published.py --dist-dir dist --version "${GITHUB_REF_NAME#v}"
