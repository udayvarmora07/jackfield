name: CI

# Policy: first-party, third-party, and reusable-workflow actions below are
# pinned to reviewed full commit SHAs with an inline version/date comment.
# The first-party pins are also listed here for quick review:
# checkout@v7.0.1 = 3d3c42e5aac5ba805825da76410c181273ba90b1,
# setup-python@v7.1.0 = 6d4fd22b20465ccc0f7354476588e8df7c9ca0e0,
# setup-node@v7.1.0 = 949feb2413d6458794dcd2491c4babbbce0c15c1,
# upload-artifact@v7.0.2 = cf430e030ddbb5b0abf93d22962f4752f3646cd9 — reviewed
# 2026-11-07 (all node24; cross-checked with git ls-remote); re-verify SHAs before changing them. `pull_request`
# runs in fork context with a read-only token; no `pull_request_target` is used.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-correctness:
    name: static correctness (pyflakes gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — 2026-11-07 reviewed
      # Ruff action v4.1.0 — reviewed 2026-09-22; keep the full SHA pin.
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0 — 2026-09-22 reviewed
        with:
          version: "0.16.8"
          args: "check --output-format=github"
          src: >-
            skillsmgr tests smoke_store.py smoke_web.py browser_harness.py
            desktop_launcher.py check_complexity.py check_docs.py check_package_data.py
            check_design_tokens.py tools/verify_ai.py tools/verify_published.py tools/verify_upgrade.py tools/ai_fidelity tools/qa
  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — 2026-11-07 reviewed
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 — 2026-11-07 reviewed
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python3 -m py_compile skillsmgr/*.py smoke_*.py tests/*.py check_*.py
      - name: Complexity budget ratchet
        run: python3 check_complexity.py
      - name: Unit tests (stdlib only, no deps)
        run: python3 -m unittest discover -s tests
      - name: AI study evidence and no-send fixture
        run: python3 tools/verify_ai.py --evidence

  adversarial:
    name: adversarial security checks
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — 2026-11-07 reviewed
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 — 2026-11-07 reviewed
        with:
          python-version: "3.12"
      - name: Archive/parser/search/concurrency contracts
        run: >-
          python3 -m unittest tests.test_archive_contracts
          tests.test_frontmatter_contracts tests.test_search_contracts
          tests.test_concurrency_contracts tests.test_path_safety
          tests.test_store_contracts tests.test_scope_contracts
      - name: Path/portability contracts (Windows separators on Linux)
        run: python3 -m unittest tests.test_ci_release_contracts.CrossPlatformContractTests

  package:
    name: package + release-artifact check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — 2026-11-07 reviewed
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 — 2026-11-07 reviewed
        with:
          python-version: "3.12"
      - name: Install the pinned, hash-verified build toolchain
        # SEC-8: same lock as the release path, so the artifacts CI verifies are
        # built by the same toolchain that produces the attested release bytes.
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-build.txt
      - name: Build wheel and sdist once
        run: python3 -m build --no-isolation --wheel --sdist --outdir dist
      - name: Package data and clean recovery on both release artifacts
        run: python3 check_package_data.py --dist-dir dist --install --require-build
      - name: AI CLI on the exact installed wheel (offline fake provider)
        run: python3 tools/verify_ai.py --artifact dist/*.whl
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — 2026-11-07 reviewed
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  docs:
    name: docs consistency
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — 2026-11-07 reviewed
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 — 2026-11-07 reviewed
        with:
          python-version: "3.12"
      - name: Documentation/source consistency
        run: python3 check_docs.py
      - name: Design token contrast
        # The design contract is DESIGN.md; this re-derives every ratio in
        # styles.css from the WCAG formula and fails on a regression. It is a
        # gate rather than guidance because a palette is a claim, and a claim
        # nobody re-checks decays silently.
        run: python3 check_design_tokens.py

  xplat:
    name: cross-platform full suite (py${{ matrix.python-version }} + ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — 2026-11-07 reviewed
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 — 2026-11-07 reviewed
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q skillsmgr tests check_package_data.py smoke_store.py smoke_web.py browser_harness.py check_docs.py check_complexity.py check_design_tokens.py
      - name: Full unit suite (stdlib only, every supported OS)
        run: python -m unittest discover -s tests
      # The one-command installers are only worth their README line if they
      # really install on each OS. These run them against this checkout
      # (venv method, isolated prefix), run the installed command, then
      # uninstall and check nothing is left behind.
      - name: One-command installer, real install and uninstall (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh install.sh --method venv --from "$PWD" --prefix "$RUNNER_TEMP/scp-venv" --bin-dir "$RUNNER_TEMP/scp-bin"
          "$RUNNER_TEMP/scp-bin/skills-mgr" --version
          sh install.sh --uninstall --method venv --prefix "$RUNNER_TEMP/scp-venv" --bin-dir "$RUNNER_TEMP/scp-bin"
          test ! -e "$RUNNER_TEMP/scp-venv"
          test ! -e "$RUNNER_TEMP/scp-bin/skills-mgr"
          test ! -L "$RUNNER_TEMP/scp-bin/skills-mgr"
      - name: One-command installer, real install and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'scp-venv'
          ./install.ps1 -Method venv -From "$PWD" -Prefix $venv
          & (Join-Path $venv 'Scripts\skills-mgr.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "installed skills-mgr exited $LASTEXITCODE" }
          ./install.ps1 -Uninstall -Method venv -Prefix $venv
          if (Test-Path $venv) { throw 'uninstall left the virtual environment behind' }
      - name: One-command installer ownership under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SKILLSMGR_TEST_POWERSHELL: powershell
        run: python -m unittest tests.test_install_script.PowerShellInstallerRuntimeTests

  browser:
    name: browser smoke and frontend syntax
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — 2026-11-07 reviewed
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 — 2026-11-07 reviewed
        with:
          python-version: "3.12"
      - name: Store smoke
        run: python3 smoke_store.py
      - name: Web smoke
        run: python3 smoke_web.py
      - name: Allow Chrome's user-namespace sandbox on the runner
        # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, so
        # Chrome aborts at ZygoteHostImpl::Init() with "No usable sandbox!" and
        # the harness cannot start. Chrome's own message offers --no-sandbox as
        # a workaround, but the harness keeps the renderer sandbox enabled by
        # design (SEC-15). Re-enabling the namespace keeps that decision intact
        # instead of weakening it, and only affects this ephemeral runner.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "unprivileged user namespaces are not AppArmor-restricted here"
          fi
      - name: Frontend syntax
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 — 2026-11-07 reviewed
        with:
          # Node >= 22 provides the global WebSocket the CDP probe uses.
          node-version: "22"
      - name: Tighten the Node tool cache permissions
        # setup-node extracts with mode 0777, so launcher_security's ownership
        # check rejects the binary and every parent directory up to /.
        # That check is correct -- tighten the runner's extraction rather than
        # weaken the policy. `go-w` keeps every execute bit, so Node still runs.
        #
        # Stop at a sticky directory: launcher_security already permits those
        # (/tmp is 1777), and `chmod go-w /tmp` would break the runner.
        run: |
          target="$(command -v node)"
          while [ -n "$target" ] && [ "$target" != "/" ] && [ -e "$target" ]; do
            if [ -k "$target" ]; then
              echo "$target is sticky; the trust check already permits it"
              break
            fi
            sudo chmod go-w "$target" || true
            target="$(dirname "$target")"
          done
      - name: Confirm the harness can resolve its executables
        run: python3 -c "import browser_harness as b; print(b._node()); print(b._chrome())"
      - name: Frontend syntax and browser harness
        run: |
          for f in skillsmgr/webui/*.js; do node --check "$f"; done
          python3 browser_harness.py

  http-contracts:
    name: HTTP regression contracts (Hurl)
    # Hurl 8.1.0 requires libxml2.so.2, which Ubuntu 24.04 provides.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — 2026-11-07 reviewed
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 — 2026-11-07 reviewed
        with:
          python-version: "3.12"
      - name: Install Hurl's libxml2 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2
      - name: Verify Hurl and run the synthetic HTTP contracts
        shell: bash
        run: |
          hurl_dir=$(mktemp -d /tmp/skillsmgr-hurl.XXXXXX)
          trap 'rm -r -- "$hurl_dir"' EXIT
          asset=hurl-8.1.0-x86_64-unknown-linux-gnu
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 180 --retry 2 --retry-max-time 300 \
            --output "$hurl_dir/$asset.tar.gz" \
            "https://github.com/Orange-OpenSource/hurl/releases/download/8.1.0/$asset.tar.gz"
          printf '%s  %s\n' b497e7ab328100c507f1f3323ebe7cc5990d831ae4f9473b74d40b02971da4ca \
            "$hurl_dir/$asset.tar.gz" | sha256sum --check
          tar -xOzf "$hurl_dir/$asset.tar.gz" "$asset/bin/hurl" > "$hurl_dir/hurl"
          chmod 0700 "$hurl_dir/hurl"
          "$hurl_dir/hurl" --version
          status=0
          python3 tools/qa/run_http.py --hurl "$hurl_dir/hurl" --output-dir "$RUNNER_TEMP/http-qa" || status=$?
          python3 tools/qa/summarize.py "$RUNNER_TEMP"/http-qa/http-*/junit.xml || status=1
          exit "$status"
      - name: Upload synthetic HTTP contract failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — 2026-11-07 reviewed
        with:
          name: http-contract-failures
          path: ${{ runner.temp }}/http-qa/http-*/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: browser e2e (headless Chrome)
    # tools/e2e_v2 drives the real web UI in a real browser
    # against a throwaway fixture HOME and data directory (loopback-only server,
    # Chrome sandbox ON). They are not unittest modules, so `unittest discover`
    # never reaches them and, until this job existed, nothing ran them.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: unit
    env:
      # Playwright is a developer/CI-only client: it is installed from the
      # hash-verified lockfile in tools/e2e_deps and drives the runner's own
      # Chrome. It is never a runtime or packaging dependency.
      NODE_PATH: ${{ github.workspace }}/tools/e2e_deps/node_modules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — 2026-11-07 reviewed
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 — 2026-11-07 reviewed
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 — 2026-11-07 reviewed
        with:
          node-version: "22"
      - name: Allow Chrome's user-namespace sandbox on the runner
        # Same reason and same scope as the `browser` job: the runner's AppArmor
        # policy would otherwise make Chrome abort with "No usable sandbox!",
        # and the renderer sandbox stays on by design (SEC-15).
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "unprivileged user namespaces are not AppArmor-restricted here"
          fi
      - name: Tighten the Node tool cache permissions
        # setup-node extracts with mode 0777, so launcher_security's ownership
        # check rejects the binary and every parent directory up to /. Tighten
        # the runner's extraction rather than weaken the policy; stop at a
        # sticky directory, which the trust check already permits.
        run: |
          target="$(command -v node)"
          while [ -n "$target" ] && [ "$target" != "/" ] && [ -e "$target" ]; do
            if [ -k "$target" ]; then
              echo "$target is sticky; the trust check already permits it"
              break
            fi
            sudo chmod go-w "$target" || true
            target="$(dirname "$target")"
          done
      - name: Install the locked Playwright client (no install scripts, no browser download)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/e2e_deps
      - name: Resolve the trusted Node and Chrome, and confirm Playwright
        # The runner image presets CHROME_BIN to a path the launcher trust check
        # rejects, and the e2e runners honour CHROME_BIN over their own lookup.
        # Point it at the executable the harness itself resolves and trusts.
        run: |
          python3 -c "import browser_harness as b; print(b._node())"
          chrome="$(python3 -c "import browser_harness as b; print(b._chrome())")"
          echo "$chrome"
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          node -e "console.log('playwright', require('playwright/package.json').version)"
      - name: UI end-to-end suite
        run: python3 tools/e2e_v2/run.py --output-dir "$RUNNER_TEMP/e2e-v2"
      - name: Upload e2e evidence (screenshots, results.json, server.log)
        # Synthetic fixtures only; no user data is ever in these folders.
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 — 2026-11-07 reviewed
        with:
          name: e2e-evidence
          path: |
            ${{ runner.temp }}/e2e-v2
          if-no-files-found: ignore
          retention-days: 7
