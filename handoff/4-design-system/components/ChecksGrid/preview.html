<!-- @dsCard group="Status" height=250 subtitle="Checks × places, with Unknown as its own answer" -->
<!doctype html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"><style>body{margin:0}.g{display:grid;grid-template-columns:minmax(160px,1.4fr) repeat(3,minmax(110px,1fr))}.g>div{padding:11px 14px;border-top:1px solid var(--line-subtle);display:flex;align-items:center}.g>div+div{border-left:1px solid var(--line-subtle)}.g>.h{border-top:0;font:600 13px/1.2 var(--font-sans)}</style></head>
<body><div class="sm-root" style="padding: 20px">
  <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; max-width: 640px">
    <div class="g">
      <div class="h" style="color: var(--mute); font-size: 12px">Check</div><div class="h">Claude Code</div><div class="h">Codex</div><div class="h">This project</div>
      <div style="font-weight: 600">Found</div><div><span class="sm-chk is-ok"><span class="sm-chk__ic" aria-hidden="true"></span>Yes</span></div><div><span class="sm-chk is-ok"><span class="sm-chk__ic" aria-hidden="true"></span>Yes</span></div><div><span class="sm-chk is-fail"><span class="sm-chk__ic" aria-hidden="true"></span>No copy here</span></div>
      <div style="font-weight: 600">Settings allow it</div><div><span class="sm-chk is-fail"><span class="sm-chk__ic" aria-hidden="true"></span>Turned off</span></div><div><span class="sm-chk is-ok"><span class="sm-chk__ic" aria-hidden="true"></span>Yes</span></div><div><span class="sm-chk is-skip"><span class="sm-chk__ic" aria-hidden="true"></span>—</span></div>
      <div style="font-weight: 600">Actually loaded</div><div><span class="sm-chk is-skip"><span class="sm-chk__ic" aria-hidden="true"></span>—</span></div><div><span class="sm-chk is-unknown"><span class="sm-chk__ic" aria-hidden="true">?</span>Unknown</span></div><div><span class="sm-chk is-skip"><span class="sm-chk__ic" aria-hidden="true"></span>—</span></div>
    </div>
  </div>
</div></body></html>
