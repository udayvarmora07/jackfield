<!doctype html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.cv{position:relative;width:960px;height:320px;background:var(--bg);overflow:hidden;font-family:var(--font-sans)}
.c-acc{fill:var(--accent)}.c-ink{fill:var(--ink)}.c-warn{fill:var(--warn-mark)}.c-soft{fill:var(--accent-soft)}
.r-xl{rx:var(--radius-xl)}.r-lg{rx:var(--radius-lg)}.r-xs{rx:var(--radius-xs)}
.name{position:absolute;left:40px;bottom:52px;margin:0;font-size:64px;line-height:.95;font-weight:600;letter-spacing:-.03em;color:var(--ink)}
.tag{position:absolute;left:40px;bottom:24px;margin:0;font-size:14px;line-height:20px;color:var(--mute)}
</style></head>
<body><div class="cv">
<!--
  blocks: accent 288x112 (r radius-xl), ink 160x112 (r radius-xl), warn-mark 56x56 (r radius-lg, a state colour kept small), accent-soft 432x112 field.
  arrangement: top-band skeleton (name too wide for the 440px zone), blocks flush left to right with space-2 (8px) gaps.
  pattern: "geometric, modular, dense UI" -> tiles like the table's squares and the 3x3 logo; README: "a calm table of truth", squares are the core component.
  scales: tile 24px = space-6, pitch 32 = space-6 + space-2, tile corners radius-xs, some tiles merged two-wide (56px) like table cells.
-->
<svg width="960" height="112" viewBox="0 0 960 112" aria-hidden="true" style="position: absolute; left: 0; top: 0">
  <rect class="c-acc r-xl" x="0" y="0" width="288" height="112"/>
  <rect class="c-ink r-xl" x="296" y="0" width="160" height="112"/>
  <rect class="c-warn r-lg" x="464" y="0" width="56" height="56"/>
  <rect class="c-soft r-xl" x="528" y="0" width="432" height="112"/>
  <g>
    <rect class="c-acc r-xs" x="544" y="8" width="24" height="24"/><rect class="c-acc r-xs" x="576" y="8" width="24" height="24"/><rect class="c-ink r-xs" x="608" y="8" width="24" height="24"/><rect class="c-acc r-xs" x="640" y="8" width="56" height="24"/><rect class="c-acc r-xs" x="704" y="8" width="24" height="24"/><rect class="c-acc r-xs" x="736" y="8" width="24" height="24"/><rect class="c-ink r-xs" x="768" y="8" width="24" height="24"/><rect class="c-acc r-xs" x="800" y="8" width="24" height="24"/><rect class="c-acc r-xs" x="832" y="8" width="56" height="24"/><rect class="c-acc r-xs" x="896" y="8" width="24" height="24"/><rect class="c-acc r-xs" x="928" y="8" width="24" height="24"/>
    <rect class="c-acc r-xs" x="544" y="44" width="24" height="24"/><rect class="c-ink r-xs" x="576" y="44" width="24" height="24"/><rect class="c-acc r-xs" x="608" y="44" width="24" height="24"/><rect class="c-acc r-xs" x="640" y="44" width="24" height="24"/><rect class="c-warn r-xs" x="672" y="44" width="24" height="24"/><rect class="c-acc r-xs" x="704" y="44" width="56" height="24"/><rect class="c-acc r-xs" x="768" y="44" width="24" height="24"/><rect class="c-acc r-xs" x="800" y="44" width="24" height="24"/><rect class="c-ink r-xs" x="832" y="44" width="24" height="24"/><rect class="c-acc r-xs" x="864" y="44" width="24" height="24"/><rect class="c-acc r-xs" x="896" y="44" width="56" height="24"/>
    <rect class="c-acc r-xs" x="544" y="80" width="56" height="24"/><rect class="c-acc r-xs" x="608" y="80" width="24" height="24"/><rect class="c-ink r-xs" x="640" y="80" width="24" height="24"/><rect class="c-acc r-xs" x="672" y="80" width="24" height="24"/><rect class="c-acc r-xs" x="704" y="80" width="24" height="24"/><rect class="c-acc r-xs" x="736" y="80" width="24" height="24"/><rect class="c-acc r-xs" x="768" y="80" width="56" height="24"/><rect class="c-acc r-xs" x="832" y="80" width="24" height="24"/><rect class="c-ink r-xs" x="864" y="80" width="24" height="24"/><rect class="c-acc r-xs" x="896" y="80" width="24" height="24"/><rect class="c-acc r-xs" x="928" y="80" width="24" height="24"/>
  </g>
</svg>
<h1 class="name">Skills Manager<br>design system</h1>
<p class="tag">A calm table of truth for every agent’s skills.</p>
</div></body></html>
