<!-- @dsCard group="Content" height=100 subtitle="Keyboard hints and agent monograms" -->
<!doctype html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"><style>body{margin:0}</style></head>
<body><div class="sm-root" style="padding: 20px; display: flex; flex-direction: column; gap: 14px; font-size: 12.5px; color: var(--mute)">
  <div style="display: flex; gap: 18px; flex-wrap: wrap">
    <span><span class="sm-kbd">↑</span> <span class="sm-kbd">↓</span> <span class="sm-kbd">←</span> <span class="sm-kbd">→</span> move between squares</span>
    <span><span class="sm-kbd">Space</span> turn on or off</span>
    <span><span class="sm-kbd">/</span> search</span>
  </div>
  <div style="display: flex; gap: 14px; align-items: center; color: var(--ink); font-size: 13px; font-weight: 600">
    <span style="display: flex; gap: 8px; align-items: center"><span class="sm-ag" aria-hidden="true" data-a="CC">CC</span>Claude Code</span>
    <span style="display: flex; gap: 8px; align-items: center"><span class="sm-ag" aria-hidden="true" data-a="CX">CX</span>Codex</span>
    <span style="display: flex; gap: 8px; align-items: center"><span class="sm-ag" aria-hidden="true" data-a="OC">OC</span>OpenCode</span>
  </div>
</div></body></html>
