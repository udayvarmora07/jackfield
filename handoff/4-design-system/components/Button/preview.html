<!-- @dsCard group="Actions" height=210 subtitle="Primary, accent, default, pressed, dark, quiet, icon" -->
<!doctype html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"><style>body{margin:0}</style></head>
<body><div class="sm-root" style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
    <div style="width: 300px"><button type="button" class="sm-btn sm-btn--primary">Turn off in Codex <span style="font: 500 11px/1 var(--font-mono); opacity: .75">Space</span></button></div>
    <button type="button" class="sm-btn sm-btn--accent sm-btn--page">Edit</button>
    <button type="button" class="sm-btn sm-btn--page">New skill</button>
    <button type="button" class="sm-btn sm-btn--accent">Save to 3 places</button>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
    <button type="button" class="sm-btn" aria-pressed="true">Show only these</button>
    <button type="button" class="sm-btn sm-btn--dark">Fix one by one</button>
    <button type="button" class="sm-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Restore</button>
    <button type="button" class="sm-btn sm-btn--quiet"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Move to Trash</button>
    <button type="button" class="sm-btn sm-btn--icon" aria-label="Switch theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button type="button" class="sm-btn sm-btn--accent" disabled>Create in 2 places</button>
    <span style="font-size: 13px; color: var(--mute)">Fix the name to continue.</span>
  </div>
</div></body></html>
