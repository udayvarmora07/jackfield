<!-- @dsCard group="Layout" height=560 subtitle="The answer to one square, before acting" -->
<!doctype html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"><style>body{margin:0}</style></head>
<body><div class="sm-root" style="padding: 20px">
  <aside class="sm-panel" aria-label="code-review in Codex">
    <div style="display: flex; align-items: center; gap: 9px"><span class="sm-ag" aria-hidden="true" data-a="CX">CX</span><span style="font-size: 13px; color: var(--ink-2); font-weight: 500">Codex</span></div>
    <h2 class="sm-panel__name">code-review</h2>
    <div class="sm-panel__path">~/.codex/skills/code-review</div>
    <p class="sm-panel__line">Codex can use this skill.</p>
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 18px">
      <span class="sm-pill sm-status is-on"><span class="sm-mk" aria-hidden="true"></span>On</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-faint)" role="img" aria-label="becomes"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      <span class="sm-pill sm-status is-off"><span class="sm-mk" aria-hidden="true"></span>Off</span>
    </div>
    <button type="button" class="sm-btn sm-btn--primary">Turn off in Codex <span style="font: 500 11px/1 var(--font-mono); opacity: .75">Space</span></button>
    <p class="sm-panel__what">The file is renamed so Codex skips it. Nothing is deleted, and you can undo it.</p>
    <div style="border-top: 1px solid var(--line-subtle); margin-top: 20px; padding-top: 14px">
      <div style="font-size: 12px; font-weight: 600; color: var(--mute); letter-spacing: .02em; margin-bottom: 6px">Other places</div>
      <div style="display: flex; justify-content: space-between; padding: 7px 0; font-size: 13.5px"><span style="display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2)"><span class="sm-ag" data-a="Claude Code" aria-hidden="true"></span>Claude Code</span><span class="sm-status is-on"><span class="sm-mk" aria-hidden="true"></span>On</span></div>
      <div style="display: flex; justify-content: space-between; padding: 7px 0; font-size: 13.5px"><span style="display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2)"><span class="sm-ag" data-a="OpenCode" aria-hidden="true"></span>OpenCode</span><span class="sm-status is-on"><span class="sm-mk" aria-hidden="true"></span>On</span></div>
      <div style="display: flex; justify-content: space-between; padding: 7px 0; font-size: 13.5px"><span style="display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2)"><span class="sm-ag" data-a="This project" aria-hidden="true"></span>This project</span><span class="sm-status is-missing"><span class="sm-mk" aria-hidden="true"></span>Not here</span></div>
    </div>
    <div style="display: flex; gap: 18px; margin-top: 16px; font-size: 14px; font-weight: 500"><a href="#">Open skill</a><a href="#">Why isn’t it running?</a></div>
  </aside>
</div></body></html>
