<!-- @dsCard group="Status" height=170 subtitle="A table row: skill, verdict and five squares, one selected" -->
<!doctype html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"><style>body{margin:0}.r{display:grid;grid-template-columns:minmax(220px,2.4fr) repeat(5,minmax(110px,1fr));background:var(--surface);border-bottom:1px solid var(--line-subtle)}</style></head>
<body><div class="sm-root" style="padding: 16px">
  <div style="border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface)">
    <div class="r">
      <div style="padding: 12px 20px"><div style="font-weight: 600">debugging-and-error-recovery</div><div style="color: var(--mute); font-size: 13px; margin-top: 2px">Find the root cause before changing code.</div><div style="color: var(--warn); font-size: 12px; font-weight: 500; margin-top: 4px">Codex has a different copy</div></div>
      <button type="button" class="sm-square" aria-label="debugging-and-error-recovery in Claude Code: On"><span class="sm-status is-on"><span class="sm-mk" aria-hidden="true"></span>On</span></button>
      <button type="button" class="sm-square" aria-pressed="true" aria-label="debugging-and-error-recovery in Codex: Different"><span class="sm-status is-different"><span class="sm-mk" aria-hidden="true"></span>Different</span></button>
      <button type="button" class="sm-square" aria-label="debugging-and-error-recovery in OpenCode: Off in settings"><span class="sm-status is-settings"><span class="sm-mk" aria-hidden="true"></span>Off in settings</span></button>
      <button type="button" class="sm-square" aria-label="debugging-and-error-recovery in Shared folder: Off"><span class="sm-status is-off"><span class="sm-mk" aria-hidden="true"></span>Off</span></button>
      <button type="button" class="sm-square" aria-label="debugging-and-error-recovery in This project: Not here"><span class="sm-status is-missing"><span class="sm-mk" aria-hidden="true"></span>Not here</span></button>
    </div>
  </div>
</div></body></html>
