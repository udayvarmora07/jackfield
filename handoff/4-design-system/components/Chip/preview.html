<!-- @dsCard group="Inputs" height=100 subtitle="Pick one or more places" -->
<!doctype html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"><style>body{margin:0}</style></head>
<body><div class="sm-root" style="padding: 20px">
  <p id="pv-where" class="sm-label" style="margin: 0 0 10px">Add it to</p>
  <div role="group" aria-labelledby="pv-where" style="display: flex; flex-wrap: wrap; gap: 8px">
    <button type="button" class="sm-chip" aria-pressed="true"><span class="sm-chip__box" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><path d="M4 12l5 5L20 6"/></svg></span><span class="agm" data-a="Claude Code" aria-hidden="true"></span>Claude Code</button>
    <button type="button" class="sm-chip" aria-pressed="true"><span class="sm-chip__box" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><path d="M4 12l5 5L20 6"/></svg></span><span class="agm" data-a="Codex" aria-hidden="true"></span>Codex</button>
    <button type="button" class="sm-chip" aria-pressed="false"><span class="sm-chip__box" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><path d="M4 12l5 5L20 6"/></svg></span><span class="agm" data-a="OpenCode" aria-hidden="true"></span>OpenCode<span style="font-size: 12px; color: var(--warn)">· different copy</span></button>
    <button type="button" class="sm-chip" aria-pressed="false"><span class="sm-chip__box" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><path d="M4 12l5 5L20 6"/></svg></span><span class="agm" data-a="Shared folder" aria-hidden="true"></span>Shared folder</button>
  </div>
</div></body></html>
