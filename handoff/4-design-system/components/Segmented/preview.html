<!doctype html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"><style>body{margin:0}</style></head>
<body><div class="sm-root" style="padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center">
  <div class="sm-seg" role="group" aria-label="View"><button type="button" class="sm-btn" aria-pressed="true">Read</button><button type="button" class="sm-btn" aria-pressed="false">File text</button></div>
  <div class="sm-seg" role="group" aria-label="Content view"><button type="button" class="sm-btn" aria-pressed="false">Write</button><button type="button" class="sm-btn" aria-pressed="true">Preview</button></div>
  <div class="sm-seg" role="group" aria-label="Theme"><button type="button" class="sm-btn" aria-pressed="false" data-i="Light">Light</button><button type="button" class="sm-btn" aria-pressed="false" data-i="Dark">Dark</button><button type="button" class="sm-btn" aria-pressed="true" data-i="Match my computer">Match my computer</button></div>
</div></body></html>
