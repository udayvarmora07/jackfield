body{margin:0}
.ph{--bg:#F6F6F3;--surface:#FFFFFF;--raise:#F5F5F3;--line:#ECECE9;--line2:#F3F3F1;--ink:#191917;--ink2:#3B3B37;--mute:#666660;--faint:#9A9A93;--faint-text:#6E6E67;--acc:#2D58D0;--acc-ink:#FFFFFF;--acc-soft:#EDF1FC;--warn:#8A4700;--warn-mk:#C06A00;--warn-soft:#FFF7EC;--warn-line:#F1DDC0;--bad:#A3261A}
.ph.dark{--bg:#121211;--surface:#1A1A19;--raise:#222220;--line:#2C2C2A;--line2:#242422;--ink:#EDEDEA;--ink2:#CFCFCA;--mute:#B0B0A9;--faint:#77776F;--faint-text:#9A9A93;--acc:#8CAEFF;--acc-ink:#0C1430;--acc-soft:#1C2540;--warn:#F2B866;--warn-mk:#F2A33C;--warn-soft:#241B10;--warn-line:#4A3517;--bad:#FF9C8F}
.ph{font-family:'IBM Plex Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.ph button:focus-visible,.ph a:focus-visible,.ph select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mk{position:relative;flex:none;width:9px;height:9px;box-sizing:border-box}
.k-on .mk{border-radius:50%;background:var(--acc)}
.k-off{color:var(--mute)}.k-off .mk{border-radius:50%;border:1.5px solid var(--faint)}
.k-set{color:var(--mute)}.k-set .mk{border-radius:50%;border:1.5px dashed var(--mute)}
.k-diff{color:var(--warn)}.k-diff .mk{width:8px;height:8px;background:var(--warn-mk);transform:rotate(45deg);border-radius:1.5px}
.k-bad{color:var(--bad)}.k-bad .mk::before,.k-bad .mk::after{content:"";position:absolute;left:3.5px;top:-1px;width:2px;height:11px;background:var(--bad);border-radius:1px;transform:rotate(45deg)}.k-bad .mk::after{transform:rotate(-45deg)}
.k-none{color:var(--faint-text)}.k-none .mk{width:9px;height:1.5px;background:var(--faint);border-radius:1px}
.prow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;border:0;border-bottom:1px solid var(--line2);background:var(--surface);text-align:left;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;color:var(--ink);box-sizing:border-box}
.prow.sel{background:var(--acc-soft)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;text-decoration:none;color:var(--mute);font-size:11px;font-weight:500}
.tab[aria-current="page"]{color:var(--ink)}
.icon44{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);border-radius:11px;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px/* unslop-ignore: design-system radius-pill, used only for labels and counts */;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const AGENTS = ['Claude Code', 'Codex', 'OpenCode', 'Shared folder', 'This project'];
const ROWS = [
  { name: 'code-review', desc: 'Review a diff for bugs before you commit.', s: ['on', 'on', 'on', 'on', 'none'] },
  { name: 'debugging-and-error-recovery', desc: 'Find the root cause before changing code.', s: ['on', 'diff', 'on', 'on', 'none'] },
  { name: 'design-system', desc: 'Lock an approved screen into tokens and components.', s: ['on', 'none', 'none', 'none', 'on'] },
  { name: 'docker-compose-patterns', desc: 'Write and fix Compose files the safe way.', s: ['off', 'off', 'none', 'none', 'none'] },
  { name: 'frontend-performance', desc: 'Measure first, then fix slow pages.', s: ['on', 'on', 'none', 'on', 'none'] },
  { name: 'git-workflow', desc: 'Branches, commits and pull requests, done cleanly.', s: ['set', 'on', 'on', 'on', 'none'] },
  { name: 'idea-brainstorm', desc: 'Think an idea through before building it.', s: ['on', 'none', 'none', 'none', 'on'] },
  { name: 'journey-map', desc: 'Draw the user journey before any UI.', s: ['on', 'none', 'none', 'none', 'on'] },
  { name: 'security-review', desc: 'Check changes for risky patterns.', s: ['on', 'bad', 'on', 'none', 'none'] },
  { name: 'test-driven-development', desc: 'Write the failing test first.', s: ['on', 'on', 'diff', 'on', 'none'] }
];
const LABEL = { on: 'On', off: 'Off', set: 'Off in settings', diff: 'Different', bad: "Can't read", none: 'Not here' };
const NEXT = { on: 'off', off: 'on', none: 'on' };
const DONE = { on: 'Turned off', off: 'Turned on', none: 'Added' };
function sheetFor(name, k, a) {
  const s = { skill: name, agent: a, region: name + ' in ' + a, now: LABEL[k], nowCls: 'k-' + k };
  if (k === 'on') Object.assign(s, { after: 'Off', afterCls: 'k-off', line: a + ' can use this skill.', primary: 'Turn off in ' + a, what: 'The file is renamed so ' + a + ' skips it. Nothing is deleted. You can undo.' });
  if (k === 'off') Object.assign(s, { after: 'On', afterCls: 'k-on', line: a + ' skips this skill.', primary: 'Turn on in ' + a, what: 'The file is renamed back. You can undo.' });
  if (k === 'set') Object.assign(s, { after: 'On', afterCls: 'k-on', line: 'The file is on, but ' + a + '’s own settings switch it off.', primary: 'Open the settings file', what: 'Skills Manager never changes agent settings files.' });

  if (k === 'bad') Object.assign(s, { after: 'Readable', afterCls: 'k-on', line: 'The file in ' + a + ' is damaged.', primary: 'Preview a replacement', what: 'The damaged file goes to Trash, so you can get it back.' });
  if (k === 'none') Object.assign(s, { after: 'On', afterCls: 'k-on', line: a + ' doesn’t have this skill yet.', primary: 'Add to ' + a, what: 'Copied from Claude Code. You can undo.' });
  return s;
}
class Component extends DCLogic {

  renderVals() {
    const ai = this.state.agent; const over = this.state.over; const a = AGENTS[ai];
    const kind = (r) => over[r.name + '|' + ai] || r.s[ai];
